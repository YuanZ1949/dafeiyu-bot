[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu"
version = "0.1.0"
description = "溟月 / 大肥鱼 QQ 群聊机器人"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "PyYAML>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
dafeiyu = "dafeiyu.cli:main"
dafeiyu-cli = "dafeiyu.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dafeiyu = ["brain/persona.md", "brain/agent_template.md", "supervisor/dashboard/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
