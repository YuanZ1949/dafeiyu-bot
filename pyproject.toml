[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu"
version = "0.1.0"
description = "溟月 / 大肥鱼 QQ 群聊机器人"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "PyYAML>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# 桌面微信桥的可选依赖。注意：PyPI 上的 `pyweixin` 只有 0.1.0 且没有分发文件，
# `pip install pyweixin` 会直接 No matching distribution；上游把 import 名
# `pyweixin` 打进了 `pywechat127` 这个发行包，所以这里写 `pywechat127`。
wechat = [
    "pywechat127==1.9.8",
    "pywinauto>=0.6.9",
    "pyautogui>=0.9.54",
    "psutil>=5.9",
    # 微信 4.1 本地库（local_db_enabled）的消息正文是 zstd 压缩的 BLOB。
    # 不装也能跑 UIA 路线；开了本地库但缺这个包时正文会退化成空串。
    "zstandard>=0.23",
]
# 入站语音转写（speech.enabled）。可选：不装时语音只保留 [语音] 占位。
# 发行包 `silk-python` 的实际 import 名是 `pysilk`（SILK 解码）；
# `faster-whisper` 首次运行会从 HF 下载模型（国内建议配 speech.hf_endpoint）。
stt = [
    "faster-whisper>=1.1",
    "silk-python>=0.2.9",
]

[project.scripts]
dafeiyu = "dafeiyu.cli:main"
dafeiyu-cli = "dafeiyu.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dafeiyu = ["brain/persona.md", "brain/agent_template.md", "supervisor/dashboard/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
