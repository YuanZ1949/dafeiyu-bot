<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NapCat 登录二维码</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f5;
    color: #1f2937;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .card {
    width: min(92vw, 720px);
    padding: 28px 32px 26px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 18px 60px rgba(15, 23, 42, .16);
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .04em; }
  .sub { margin: 0 0 22px; color: #64748b; font-size: 15px; }
  .qr-slot {
    display: inline-flex;
    padding: 14px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
  }
  #qr {
    display: block;
    width: min(72vw, 588px);
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .status {
    min-height: 22px;
    margin: 18px 0 8px;
    color: #0f766e;
    font-size: 14px;
  }
  .hint {
    margin: 0 auto;
    max-width: 560px;
    color: #64748b;
    font-size: 13px;
    line-height: 1.7;
  }
  .actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
  button {
    padding: 9px 18px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: #f8fafc;
    color: #334155;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f1f5f9; }
</style>
</head>
<body>
  <main class="card">
    <h1>NapCat 登录</h1>
    <p class="sub">用手机 QQ 扫描下方二维码，登录机器人小号</p>
    <div class="qr-slot" id="qr-slot">
      <img id="qr" src="qrcode.png" alt="QQ 登录二维码">
    </div>
    <p class="status" id="status">正在读取二维码……</p>
    <p class="hint">
      QQ 单张二维码约 2 分钟过期；过期后 NapCat 会自动换新码，本页也会自动更新，
      不用抢时间。如果手机提示已过期，等 2 秒再扫当前画面即可。
    </p>
    <div class="actions">
      <button type="button" id="fullscreen">全屏显示</button>
      <button type="button" id="reload">立即刷新</button>
    </div>
  </main>
<script>
  (function () {
    var slot = document.getElementById('qr-slot');
    var status = document.getElementById('status');
    var current = document.getElementById('qr');
    var first = true;

    function load() {
      var next = new Image();
      next.id = 'qr';
      next.alt = 'QQ 登录二维码';
      next.onload = function () {
        slot.replaceChild(next, current);
        current = next;
        status.textContent = first ? '二维码已加载' : '已刷新 · ' + new Date().toLocaleTimeString();
        first = false;
      };
      next.onerror = function () {
        status.textContent = '等待 NapCat 生成二维码……';
      };
      next.src = 'qrcode.png?t=' + Date.now();
    }

    document.getElementById('reload').addEventListener('click', load);
    document.getElementById('fullscreen').addEventListener('click', function () {
      var root = document.documentElement;
      if (root.requestFullscreen) root.requestFullscreen();
    });

    load();
    setInterval(load, 2000);
  })();
</script>
</body>
</html>
