<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>大肥鱼控制台 · 登录</title>
<style>
  :root {
    --bg: #080b11;
    --panel: #10151f;
    --panel-2: #18202e;
    --line: #273144;
    --text: #e9eefb;
    --muted: #8d97ab;
    --bad: #ff6b6b;
    --accent: #58a6ff;
    --accent-hot: #2563eb;
    --hot: #ff9f5a;
    --mode-glow: rgba(88, 166, 255, .20);
    --shadow: rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background:
      radial-gradient(620px 340px at 50% -6%, var(--mode-glow), transparent 70%),
      radial-gradient(520px 300px at 92% 8%, color-mix(in srgb, var(--hot) 10%, transparent), transparent 66%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .login-card {
    width: min(400px, calc(100vw - 32px));
    background: linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 42%, var(--panel)), var(--panel) 180px);
    border: 1px solid color-mix(in srgb, var(--line) 84%, var(--text) 8%);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent),
                0 30px 70px -40px var(--shadow);
  }
  h1 {
    display: flex; align-items: center; gap: 10px;
    margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em;
  }
  h1::before {
    content: ""; width: 22px; height: 22px; flex: 0 0 auto; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 8%, var(--hot) 62%, var(--accent-hot));
    box-shadow: 0 0 0 3px var(--mode-glow), 0 8px 20px -8px var(--mode-glow);
  }
  .sub { margin: 10px 0 24px; color: var(--muted); font-size: 12.5px; }
  label { display: grid; gap: 7px; margin-bottom: 15px; color: var(--muted); font-size: 12.5px; letter-spacing: .02em; }
  input {
    width: 100%;
    background: color-mix(in srgb, var(--panel-2) 82%, var(--bg));
    color: var(--text);
    border: 1px solid color-mix(in srgb, var(--line) 86%, var(--text) 6%);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    transition: border-color .15s ease, background .15s ease;
  }
  input:hover { border-color: color-mix(in srgb, var(--line) 56%, var(--accent)); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hot));
    color: #fff;
    border: 1px solid color-mix(in srgb, var(--accent-hot) 72%, var(--accent));
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    box-shadow: 0 12px 26px -18px var(--accent-hot);
    transition: filter .15s ease, transform .15s ease;
  }
  button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  button:active { transform: none; }
  button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .error { min-height: 20px; margin-top: 12px; color: var(--bad); font-size: 12.5px; }
  .foot {
    margin-top: 20px; padding-top: 14px;
    border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    color: var(--muted); font-size: 11.5px; line-height: 1.7;
  }
  @media (max-width: 420px) {
    .login-card { padding: 22px 18px; }
    /* 16px 是 iOS Safari 不自动放大输入框的下限。 */
    input { font-size: 16px; }
  }
</style>
</head>
<body>
<main class="login-card">
  <h1>大肥鱼控制台</h1>
  <p class="sub">这个控制台可以从局域网/VPN 访问，请先登录。</p>
  <form id="login-form">
    <input id="login-next" type="hidden" value="__NEXT__" />
    <label>
      用户名
      <input id="login-user" name="username" autocomplete="username" autofocus required />
    </label>
    <label>
      密码
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
    </label>
    <button id="login-submit" type="submit">登录</button>
    <div class="error" id="login-error" role="alert"></div>
  </form>
  <div class="foot">连续 5 次失败会临时锁定 5 分钟。远程访问请走 VPN 或 TLS 反代。</div>
</main>
<script>
const form = document.getElementById("login-form");
const button = document.getElementById("login-submit");
const error = document.getElementById("login-error");
const nextInput = document.getElementById("login-next");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  error.textContent = "";
  button.disabled = true;
  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("login-user").value,
        password: document.getElementById("login-password").value,
      }),
    });
    if (response.status === 204) {
      location.replace(nextInput.value || "/");
      return;
    }
    let data = null;
    try { data = await response.json(); } catch (_) { data = null; }
    if (response.status === 429) {
      error.textContent = "尝试次数过多，请 5 分钟后再试";
    } else if (response.status === 401) {
      error.textContent = "用户名或密码错误";
    } else {
      error.textContent = (data && data.error) || `登录失败（HTTP ${response.status}）`;
    }
  } catch (_) {
    error.textContent = "无法连接控制台，请检查服务是否在运行";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
