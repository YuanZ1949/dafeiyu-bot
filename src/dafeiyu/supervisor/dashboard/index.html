<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼控制台</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --line: #2a3040;
    --text: #dfe4ee;
    --muted: #8b93a7;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #1d4ed8; border-color: #1d4ed8; }
  .btn.danger { background: #7f1d1d; border-color: #7f1d1d; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; max-width: 1400px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: 999px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .st-running .dot { background: var(--ok); }
  .st-starting .dot, .st-restarting .dot { background: var(--warn); }
  .st-failed .dot { background: var(--bad); }
  .st-external .dot { background: var(--accent); }
  .st-stopped .dot { background: #4b5563; }
  .kv { color: var(--muted); font-size: 12px; }
  .mem-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .mem-col h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .mem-list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
  .mem-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); }
  .mem-meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .mem-text { white-space: pre-wrap; word-break: break-word; }
  .mem-empty { color: var(--muted); font-size: 12px; }
  .proc-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .proc-actions { margin-top: 10px; display: flex; gap: 6px; }
  .proc-actions .btn { padding: 4px 10px; font-size: 12px; }
  .mode-list { display: grid; gap: 8px; }
  .mode {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    cursor: pointer; background: var(--panel-2);
  }
  .mode.active { border-color: var(--accent); background: #1b2436; }
  .mode.disabled { opacity: .5; cursor: not-allowed; }
  .mode .label { font-weight: 600; }
  .mode .reason { color: var(--muted); font-size: 12px; margin-left: auto; }
  select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 180px;
  }
  #qr-wrap { display: flex; gap: 14px; align-items: center; }
  #qr { width: 180px; height: 180px; object-fit: contain; background: #fff; border-radius: 8px; }
  #qr.empty { display: none; }
  #qr-placeholder { width: 180px; height: 180px; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
  .log-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tab { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; color: var(--muted); }
  .tab.active { color: var(--text); border-color: var(--accent); background: var(--panel-2); }
  pre#logs {
    margin: 0; height: 320px; overflow: auto;
    background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font: 12px/1.55 Consolas, "Cascadia Mono", monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 380px;
    background: #1f2937; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-left-color: var(--bad); }
  input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  .usage-grid { display: grid; grid-template-columns: minmax(320px, 2fr) minmax(240px, 1fr); gap: 16px; }
  .usage-bars { display: flex; align-items: flex-end; gap: 4px; height: 128px; padding-top: 6px; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100%; }
  .bar-stack { display: flex; flex-direction: column; justify-content: flex-end; height: 100px; gap: 1px; }
  .bar-seg { background: var(--accent); border-radius: 2px; min-height: 0; }
  .bar-seg.err { background: var(--bad); }
  .bar-label { color: var(--muted); font-size: 10px; text-align: center; white-space: nowrap; overflow: hidden; }
  .usage-totals { margin-top: 8px; justify-content: space-between; }
  .session-list { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
  .session-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel-2);
  }
  .session-row .who { font-weight: 600; min-width: 110px; }
  .session-row .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 180px; }
  .session-row .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .session-row .btn { padding: 4px 9px; font-size: 12px; }
  .cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 18px; }
  .cfg-grid b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>大肥鱼控制台</h1>
  <span id="hub-state" class="pill"><span class="dot"></span><span>连接中…</span></span>
  <span class="spacer"></span>
  <button class="btn" data-act="start" data-target="all">全部启动</button>
  <button class="btn" data-act="restart" data-target="all">全部重启</button>
  <button class="btn danger" data-act="stop" data-target="all">全部停止</button>
  <button class="btn danger" id="btn-shutdown">退出控制台</button>
</header>

<main>
  <section class="grid-3" id="processes"></section>

  <section class="card">
    <h2>大脑模式</h2>
    <div class="mode-list" id="modes"></div>
    <div class="row" style="margin-top:12px" id="model-row" hidden>
      <select id="model-select"></select>
      <button class="btn" id="btn-refresh-models">刷新模型列表</button>
      <span class="kv" id="model-hint"></span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btn-apply-brain">应用切换</button>
      <span class="kv" id="brain-hint"></span>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">记忆</h2>
      <span class="kv" id="memory-hint"></span>
      <span class="spacer" style="flex:1"></span>
      <select id="memory-chat-filter" title="按会话类型筛选">
        <option value="">全部会话</option>
        <option value="group">只看群聊</option>
        <option value="private">只看私聊</option>
      </select>
      <input id="memory-chat-id" type="number" min="1" placeholder="会话 ID" style="width:110px" title="手动触发用的会话 ID" />
      <button class="btn" id="btn-summarize">生成摘要</button>
      <button class="btn" id="btn-extract">抽取印象</button>
      <button class="btn" id="btn-more-memory">显示更多</button>
      <button class="btn" id="btn-refresh-memory">刷新</button>
    </div>
    <div class="mem-grid">
      <div class="mem-col">
        <h3>按日摘要</h3>
        <div class="mem-list" id="memory-summaries"></div>
      </div>
      <div class="mem-col">
        <h3>群印象</h3>
        <div class="mem-list" id="memory-impressions"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">用量趋势</h2>
      <span class="kv" id="usage-hint"></span>
      <span class="spacer" style="flex:1"></span>
      <select id="usage-days" title="统计区间">
        <option value="7">近 7 天</option>
        <option value="14">近 14 天</option>
        <option value="30">近 30 天</option>
      </select>
      <button class="btn" id="btn-refresh-usage">刷新</button>
    </div>
    <div class="usage-grid">
      <div>
        <div class="usage-bars" id="usage-bars"></div>
        <div class="row kv usage-totals" id="usage-totals"></div>
      </div>
      <div>
        <h3 style="font-size:12px;color:var(--muted);margin:0 0 6px">回复最多的会话</h3>
        <div class="mem-list" id="usage-top" style="max-height:110px"></div>
        <h3 style="font-size:12px;color:var(--muted);margin:10px 0 6px">最近错误</h3>
        <div class="mem-list" id="usage-errors" style="max-height:110px"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">记忆搜索</h2>
      <span class="kv" id="search-hint"></span>
    </div>
    <div class="row" style="margin-bottom:10px">
      <input id="search-q" placeholder="搜聊天记录里的关键词…" style="flex:1;min-width:200px" />
      <select id="search-chat-filter">
        <option value="">全部会话</option>
        <option value="group">只看群聊</option>
        <option value="private">只看私聊</option>
      </select>
      <input id="search-chat-id" type="number" min="1" placeholder="会话 ID（可选）" style="width:130px" />
      <button class="btn primary" id="btn-search">搜索</button>
      <button class="btn" id="btn-search-more" disabled>更多</button>
    </div>
    <div class="mem-list" id="search-results" style="max-height:340px"></div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">会话管理</h2>
      <span class="kv" id="sessions-hint"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="btn-refresh-sessions">刷新</button>
    </div>
    <div class="session-list" id="sessions"></div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">运行配置</h2>
      <span class="kv" id="config-hint">只读</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="btn-restart-bot">重启 Bot</button>
      <button class="btn" id="btn-refresh-config">刷新</button>
    </div>
    <div class="kv cfg-grid" id="config-body"></div>
  </section>

  <section class="card">
    <h2>登录二维码</h2>
    <div class="row" style="margin-bottom:10px">
      <span class="pill st-stopped" id="login-state"><span class="dot"></span>登录状态未知</span>
      <span class="kv" id="login-hint"></span>
    </div>
    <div id="qr-wrap">
      <img id="qr" alt="登录二维码" class="empty" />
      <div id="qr-placeholder">暂无二维码<br />NapCat 需要登录时会自动出现</div>
      <div>
        <div class="kv" id="qr-meta">—</div>
        <div class="kv" style="margin-top:6px">扫码后会自动刷新，过期二维码会标黄。</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>日志</h2>
    <div class="log-head" id="log-tabs"></div>
    <pre id="logs"></pre>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const STATUS_TEXT = {
  running: "运行中", starting: "启动中", stopping: "停止中", stopped: "已停止",
  restarting: "重启中", failed: "连续失败", external: "外部运行",
};
const PROC_TITLE = { opencode: "OpenCode", bot: "Bot", napcat: "NapCat" };
const LOG_SOURCES = ["supervisor", "opencode", "bot", "napcat"];
const MODE_ORDER = ["local_model", "token", "opencode"];

let state = null;
let selectedProvider = null;
let selectedModel = "";
let currentSource = "bot";
let eventSource = null;

const $ = (id) => document.getElementById(id);

function toast(message, isError = false) {
  const el = $("toast");
  el.textContent = message;
  el.classList.toggle("err", isError);
  el.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => el.classList.remove("show"), 3200);
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  let data = null;
  try { data = await resp.json(); } catch (_) { data = null; }
  if (!resp.ok) {
    const reason = (data && (data.error || data.reason)) || `HTTP ${resp.status}`;
    throw new Error(reason);
  }
  return data;
}

function fmtUptime(seconds) {
  if (!seconds) return "—";
  const s = Math.floor(seconds);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m${s % 60}s`;
  return `${Math.floor(s / 3600)}h${Math.floor((s % 3600) / 60)}m`;
}

function renderProcesses() {
  const box = $("processes");
  const list = (state && state.processes) || [];
  if (!list.length) { box.innerHTML = '<div class="card kv">尚未获取到进程状态</div>'; return; }
  box.innerHTML = list.map((p) => {
    const st = p.status || "stopped";
    return `
      <div class="card">
        <div class="proc-name">${PROC_TITLE[p.name] || p.name}</div>
        <span class="pill st-${st}"><span class="dot"></span>${STATUS_TEXT[st] || st}</span>
        <div class="kv" style="margin-top:8px">
          PID ${p.pid || "—"} · 端口 ${p.port || "—"}<br />
          运行 ${fmtUptime(p.uptime_seconds)} · 重启 ${p.restart_count} 次
          ${p.last_exit_code !== null && p.last_exit_code !== undefined ? ` · 上次退出码 ${p.last_exit_code}` : ""}
        </div>
        <div class="proc-actions">
          <button class="btn" data-act="start" data-target="${p.name}" ${st === "external" ? "disabled" : ""}>启动</button>
          <button class="btn" data-act="stop" data-target="${p.name}" ${st === "external" ? "disabled" : ""}>停止</button>
          <button class="btn" data-act="restart" data-target="${p.name}" ${st === "external" ? "disabled" : ""}>重启</button>
        </div>
      </div>`;
  }).join("");
}

function renderBrain() {
  const brain = (state && state.brain) || {};
  const modes = brain.modes && brain.modes.length
    ? brain.modes
    : MODE_ORDER.map((id) => ({ id, label: id, ready: false, reason: "bot 未运行" }));
  if (selectedProvider === null) selectedProvider = brain.provider || modes[0].id;
  if (brain.provider) selectedProvider = selectedProvider || brain.provider;

  $("modes").innerHTML = modes
    .slice()
    .sort((a, b) => MODE_ORDER.indexOf(a.id) - MODE_ORDER.indexOf(b.id))
    .map((m) => {
      const active = m.id === selectedProvider ? " active" : "";
      const disabled = m.ready ? "" : " disabled";
      return `<div class="mode${active}${disabled}" data-mode="${m.id}">
        <span class="label">${m.label}</span>
        ${m.ready ? "" : `<span class="reason">${m.reason || "不可用"}</span>`}
      </div>`;
    }).join("");

  const showModel = selectedProvider === "local_model";
  $("model-row").hidden = !showModel;
  if (showModel) {
    const select = $("model-select");
    const activeModel = selectedModel || brain.model || "";
    const options = Array.from(select.options).map((o) => o.value);
    if (activeModel && !options.includes(activeModel)) {
      select.insertAdjacentHTML("beforeend", `<option value="${activeModel}">${activeModel}</option>`);
    }
    if (activeModel) select.value = activeModel;
  }

  const gw = brain.gateway_connected;
  const tip = brain.available === false
    ? "bot 未运行，无法读取模式"
    : `当前：${(modes.find((m) => m.id === brain.provider) || {}).label || brain.provider || "—"}` +
      (brain.model ? ` · ${brain.model}` : "") +
      ` · OneBot ${gw ? "已连接" : "未连接"}`;
  $("brain-hint").textContent = tip;
}

function applyStatus(data) {
  state = data;
  const alive = data.brain && data.brain.available;
  $("hub-state").className = `pill st-${alive ? "running" : "failed"}`;
  $("hub-state").innerHTML = `<span class="dot"></span>${alive ? "bot 在线" : "bot 离线"}`;
  renderProcesses();
  renderBrain();
  renderLogin(data.napcat);
  renderQr(data.qr, data.napcat);
}

function renderLogin(napcat) {
  const pill = $("login-state");
  const hint = $("login-hint");
  let cls = "st-stopped";
  let text = "未配置登录探测";
  let note = "";
  if (napcat && napcat.configured !== false) {
    if (!napcat.reachable) {
      cls = "st-failed";
      text = "NapCat 未响应";
      note = napcat.error || "";
    } else if (napcat.logged_in) {
      const who = [napcat.qq, napcat.nickname].filter(Boolean).join(" ");
      cls = "st-running";
      text = who ? `已登录 · ${who}` : "已登录";
      note = "NapCat 已在线，二维码已失效。";
    } else {
      cls = "st-starting";
      text = napcat.phase_label ? `未登录 · ${napcat.phase_label}` : "未登录";
      note = napcat.error || "用手机 QQ 扫描二维码登录。";
    }
  }
  pill.className = `pill ${cls}`;
  pill.textContent = "";
  const dot = document.createElement("span");
  dot.className = "dot";
  pill.appendChild(dot);
  pill.appendChild(document.createTextNode(text));
  hint.textContent = note;
}

function renderQr(qr, napcat) {
  const img = $("qr");
  const placeholder = $("qr-placeholder");
  const meta = $("qr-meta");
  if (napcat && napcat.logged_in) {
    img.classList.add("empty");
    placeholder.style.display = "grid";
    meta.textContent = "已登录，无需二维码";
    meta.style.color = "var(--ok)";
    return;
  }
  if (!qr || !qr.exists) {
    img.classList.add("empty");
    placeholder.style.display = "grid";
    meta.textContent = "暂无二维码";
    return;
  }
  placeholder.style.display = "none";
  img.classList.remove("empty");
  const bust = Math.floor(Date.now() / 5000);
  img.src = `/api/qr/image?t=${bust}`;
  meta.textContent = `生成于 ${qr.age_seconds}s 前${qr.stale ? " · 可能已过期" : ""}`;
  meta.style.color = qr.stale ? "var(--warn)" : "var(--muted)";
}

async function refresh() {
  try {
    applyStatus(await api("/api/status"));
  } catch (err) {
    $("hub-state").className = "pill st-failed";
    $("hub-state").innerHTML = '<span class="dot"></span>控制台异常';
  }
}

function chatLabel(item) {
  const kind = item.chat_type === "group" ? "群" : "私聊";
  return `${kind} ${item.chat_id}`;
}

function memItem(meta, text) {
  const item = document.createElement("div");
  item.className = "mem-item";
  const head = document.createElement("div");
  head.className = "mem-meta";
  head.textContent = meta;
  const body = document.createElement("div");
  body.className = "mem-text";
  body.textContent = text;
  item.append(head, body);
  return item;
}

function renderMemory(data) {
  const summaries = (data && data.summaries) || [];
  const impressions = (data && data.impressions) || [];
  const summaryBox = $("memory-summaries");
  const impressionBox = $("memory-impressions");

  summaryBox.replaceChildren();
  impressionBox.replaceChildren();
  summaries.forEach((s) => {
    summaryBox.appendChild(memItem(`${chatLabel(s)} · ${s.date}`, s.content));
  });
  impressions.forEach((i) => {
    const subject = i.subject_user_id ? ` · 用户 ${i.subject_user_id}` : "";
    const confidence = Math.round((i.confidence || 0) * 100);
    const item = memItem(
      `${chatLabel(i)} · ${i.kind}${subject} · ${confidence}%`,
      i.content
    );
    if (i.id) {
      const remove = document.createElement("button");
      remove.className = "btn";
      remove.textContent = "删除";
      remove.addEventListener("click", () => deleteImpression(i.id));
      item.appendChild(remove);
    }
    impressionBox.appendChild(item);
  });
  if (!summaries.length) summaryBox.innerHTML = '<div class="mem-empty">库里还没有摘要</div>';
  if (!impressions.length) impressionBox.innerHTML = '<div class="mem-empty">库里还没有印象</div>';
  const summaryTotal = Number(data && data.summary_total);
  const impressionTotal = Number(data && data.impression_total);
  const totalShown = Number.isFinite(summaryTotal) && Number.isFinite(impressionTotal);
  let hint = totalShown
    ? `摘要 ${summaries.length}/${summaryTotal} · 印象 ${impressions.length}/${impressionTotal}`
    : `摘要 ${summaries.length} 条 · 印象 ${impressions.length} 条`;
  // 配额熔断时记忆任务全停，面板只说「没有摘要」会被当成故障。
  const quota = (data && data.quota) || {};
  const quotaUntil = Number(quota.until);
  if (quota.paused && Number.isFinite(quotaUntil)) {
    const at = new Date(quotaUntil * 1000);
    const clock = at.toLocaleTimeString("zh-CN", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    });
    hint += ` · 配额暂停中，${clock} 后恢复`;
  }
  $("memory-hint").textContent = hint;
  // 分页上限以服务端 limit_max 为准；字段缺失（旧服务端）才用下面的兜底常量。
  const limitMax = Number(data && data.limit_max);
  if (Number.isFinite(limitMax) && limitMax > 0) memoryPageMax = limitMax;
  if (memoryLimit > memoryPageMax) memoryLimit = memoryPageMax;
  const more =
    data && (data.summary_has_more || data.impression_has_more) !== undefined
      ? Boolean(data.summary_has_more || data.impression_has_more)
      : summaries.length >= memoryLimit || impressions.length >= memoryLimit;
  $("btn-more-memory").disabled = !more || memoryLimit >= memoryPageMax;
}

const MEMORY_PAGE = 30;
// 只在 /api/memory 没有 limit_max 的旧服务端上生效；正常路径读服务端字段。
const MEMORY_PAGE_MAX_FALLBACK = 200;
let memoryPageMax = MEMORY_PAGE_MAX_FALLBACK;
let memoryLimit = MEMORY_PAGE;

function memoryUrl() {
  const params = new URLSearchParams({ limit: String(memoryLimit) });
  const chatType = $("memory-chat-filter").value;
  if (chatType) params.set("chat_type", chatType);
  return `/api/memory?${params.toString()}`;
}

async function loadMemory() {
  try {
    renderMemory(await api(memoryUrl()));
  } catch (err) {
    $("memory-summaries").replaceChildren();
    $("memory-impressions").replaceChildren();
    $("memory-hint").textContent = `读取失败：${err.message}`;
  }
}

function memoryTarget() {
  const chatId = Number($("memory-chat-id").value);
  if (!Number.isInteger(chatId) || chatId <= 0) throw new Error("请先填会话 ID");
  const chatType = $("memory-chat-filter").value || "group";
  return { chat_type: chatType, chat_id: chatId };
}

async function triggerSummary() {
  try {
    const data = await api("/api/memory/summaries", {
      method: "POST",
      body: JSON.stringify(memoryTarget()),
    });
    toast(data.summary ? `已生成 ${data.date} 摘要` : `${data.date} 没有可总结的消息`);
    loadMemory();
  } catch (err) {
    toast(`生成摘要失败：${err.message}`, true);
  }
}

async function triggerExtract() {
  try {
    const data = await api("/api/memory/impressions", {
      method: "POST",
      body: JSON.stringify(memoryTarget()),
    });
    toast(`已抽取 ${data.added} 条印象`);
    loadMemory();
  } catch (err) {
    toast(`抽取印象失败：${err.message}`, true);
  }
}

async function deleteImpression(id) {
  if (!confirm(`删除印象 #${id}？`)) return;
  try {
    await api(`/api/memory/impressions/${id}`, { method: "DELETE" });
    toast("已删除");
    loadMemory();
  } catch (err) {
    toast(`删除失败：${err.message}`, true);
  }
}

function chatName(type, id) {
  return `${type === "group" ? "群" : "私聊"} ${id}`;
}

function fmtTokens(n) {
  const value = Number(n) || 0;
  if (value >= 100000000) return `${(value / 100000000).toFixed(1)}亿`;
  if (value >= 10000) return `${(value / 10000).toFixed(1)}万`;
  return String(value);
}

let usageDays = 7;

async function loadUsage() {
  try {
    const data = await api(`/api/usage?days=${usageDays}`);
    const series = data.series || [];
    const max = Math.max(1, ...series.map((d) => (d.calls || 0) + (d.errors || 0)));
    $("usage-bars").innerHTML = series.map((d) => {
      const calls = d.calls || 0;
      const errors = d.errors || 0;
      const total = calls + errors;
      const scaled = Math.round((total / max) * 100);
      const errHeight = total ? Math.round((errors / total) * scaled) : 0;
      const callHeight = scaled - errHeight;
      const label = usageDays > 14 ? String(Number(d.date.slice(8))) : d.date.slice(5);
      return `<div class="bar-col" title="${d.date} · 回复 ${calls} · 错误 ${errors} · Token ${d.tokens}">
        <div class="bar-stack">
          ${errors ? `<div class="bar-seg err" style="height:${errHeight}px"></div>` : ""}
          ${calls ? `<div class="bar-seg" style="height:${callHeight}px"></div>` : ""}
        </div>
        <div class="bar-label">${label}</div>
      </div>`;
    }).join("");
    const totals = data.totals || {};
    $("usage-hint").textContent = `${data.start} ~ ${data.end}`;
    $("usage-totals").innerHTML =
      `<span>回复 <b>${totals.calls || 0}</b></span>` +
      `<span>错误 <b>${totals.errors || 0}</b></span>` +
      `<span>Token <b>${fmtTokens(totals.tokens)}</b></span>`;

    const top = data.top || [];
    $("usage-top").innerHTML = top.length
      ? top.map((r) => `<div class="mem-item">
          <div class="mem-meta">${chatName(r.chat_type, r.chat_id)}</div>
          <div class="mem-text">回复 ${r.calls} 次 · ${fmtTokens(r.tokens)} token${r.errors ? ` · 错误 ${r.errors}` : ""}</div>
        </div>`).join("")
      : '<div class="mem-empty">区间内还没有回复</div>';

    const errors = data.recent_errors || [];
    $("usage-errors").innerHTML = errors.length
      ? errors.map((r) => `<div class="mem-item">
          <div class="mem-meta">${r.at || "—"}</div>
          <div class="mem-text">${chatName(r.chat_type, r.chat_id)}</div>
        </div>`).join("")
      : '<div class="mem-empty">没有错误记录</div>';
  } catch (err) {
    $("usage-hint").textContent = `读取失败：${err.message}`;
  }
}

const SEARCH_PAGE = 20;
let searchOffset = 0;
let searchTotal = 0;

async function searchMessages(append) {
  const q = $("search-q").value.trim();
  if (!q) { toast("先输入关键词", true); return; }
  const chatType = $("search-chat-filter").value;
  const chatId = $("search-chat-id").value.trim();
  if (chatId && !chatType) { toast("填了会话 ID 就要选会话类型", true); return; }
  const params = new URLSearchParams({ q, limit: String(SEARCH_PAGE) });
  if (chatType) params.set("chat_type", chatType);
  if (chatId) params.set("chat_id", chatId);
  if (append) params.set("offset", String(searchOffset));
  try {
    const data = await api(`/api/memory/search?${params.toString()}`);
    const items = data.items || [];
    const box = $("search-results");
    if (!append) box.replaceChildren();
    items.forEach((m) => {
      box.appendChild(memItem(
        `${chatName(m.chat_type, m.chat_id)} · ${m.at || "—"} · ${m.is_bot ? "大肥鱼" : m.nickname}`,
        m.content
      ));
    });
    searchTotal = data.total || 0;
    searchOffset = (append ? searchOffset : 0) + items.length;
    if (!searchTotal) box.innerHTML = '<div class="mem-empty">没有匹配的消息</div>';
    $("search-hint").textContent = `匹配 ${searchTotal} 条 · 已显示 ${searchOffset}`;
    $("btn-search-more").disabled = searchOffset >= searchTotal;
  } catch (err) {
    toast(`搜索失败：${err.message}`, true);
  }
}

async function loadSessions() {
  try {
    const data = await api("/api/sessions");
    const items = data.items || [];
    const box = $("sessions");
    box.replaceChildren();
    items.forEach((s) => {
      const row = document.createElement("div");
      row.className = "session-row";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = chatName(s.chat_type, s.chat_id);
      const meta = document.createElement("div");
      meta.className = "meta";
      const parts = [
        `消息 ${s.message_count}`,
        `摘要 ${s.summary_count}`,
        `印象 ${s.impression_count}`,
      ];
      if (s.last_message_at) {
        parts.push(`最近 ${new Date(s.last_message_at * 1000).toLocaleString("zh-CN", { hour12: false })}`);
      }
      if (s.session_id) parts.push(`session ${String(s.session_id).slice(0, 14)}`);
      if (s.delivered_count) parts.push(`已投递 ${s.delivered_count}`);
      if (s.token_estimate) parts.push(`${fmtTokens(s.token_estimate)} token`);
      meta.textContent = parts.join(" · ");
      const acts = document.createElement("div");
      acts.className = "acts";
      const add = (label, cls, onClick) => {
        const btn = document.createElement("button");
        btn.className = `btn ${cls}`.trim();
        btn.textContent = label;
        btn.addEventListener("click", onClick);
        acts.appendChild(btn);
      };
      add("新建会话", "", () => sessionAction(s, "new", "只清 session 映射，消息和摘要都会保留。继续？"));
      add("软忘记", "", () => sessionAction(s, "forget", "将清空该会话的消息和映射，保留摘要与印象。继续？"));
      add("彻底删除", "danger", () => hardDeleteSession(s));
      add("导出 MD", "", () => exportChat(s, "md"));
      add("导出 JSON", "", () => exportChat(s, "json"));
      row.append(who, meta, acts);
      box.appendChild(row);
    });
    $("sessions-hint").textContent = `${items.length} 个会话`;
    if (!items.length) box.innerHTML = '<div class="mem-empty">还没有会话记录</div>';
  } catch (err) {
    $("sessions-hint").textContent = `读取失败：${err.message}`;
  }
}

async function sessionAction(session, action, ask) {
  if (!confirm(ask)) return;
  try {
    await api(`/api/sessions/${session.chat_type}/${session.chat_id}/${action}`, {
      method: "POST",
      body: "{}",
    });
    toast(action === "new" ? "已新建会话" : "已软忘记");
    loadSessions();
    loadMemory();
    loadUsage();
  } catch (err) {
    toast(`操作失败：${err.message}`, true);
  }
}

async function hardDeleteSession(session) {
  if (!confirm(`彻底删除 ${chatName(session.chat_type, session.chat_id)}？\n会删除远端 session 和本地全部消息、摘要、印象、用量，且不可恢复。`)) return;
  try {
    await api(`/api/sessions/${session.chat_type}/${session.chat_id}`, { method: "DELETE" });
    toast("已彻底删除");
    loadSessions();
    loadMemory();
    loadUsage();
  } catch (err) {
    toast(`删除失败：${err.message}`, true);
  }
}

async function exportChat(session, format) {
  const params = new URLSearchParams({
    chat_type: session.chat_type,
    chat_id: String(session.chat_id),
    format,
  });
  try {
    const resp = await fetch(`/api/memory/export?${params.toString()}`);
    if (!resp.ok) {
      let reason = `HTTP ${resp.status}`;
      try {
        const data = await resp.json();
        reason = (data && data.error) || reason;
      } catch (_) { /* 非 JSON 错误体 */ }
      throw new Error(reason);
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `dafeiyu-${session.chat_type}-${session.chat_id}.${format === "json" ? "json" : "md"}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("已开始下载");
  } catch (err) {
    toast(`导出失败：${err.message}`, true);
  }
}

async function loadConfig() {
  try {
    const c = await api("/api/config");
    const providerModel = c.brain.model ? `${c.brain.provider} · ${c.brain.model}` : c.brain.provider;
    const agent = c.brain.provider === "opencode" ? ` · agent ${c.brain.agent}` : "";
    const rows = [
      ["大脑", providerModel + agent],
      ["人设", `${c.persona.name} · 回复 ${c.persona.max_reply_chars}/${c.persona.max_reply_chars_technical} 字 · OS ${(c.persona.os_probability * 100).toFixed(1)}%`],
      ["冷却", `错误回复 ${c.cooldown.brain_error_seconds}s · 工具提示 ${c.cooldown.tool_hint_seconds}s`],
      ["限流", `${c.rate_limit.window_seconds / 60} 分钟内 ${c.rate_limit.threshold} 次 429 → 退避 ${c.rate_limit.backoff_seconds}s · 配额暂停 ${Math.round(c.rate_limit.quota_pause_seconds / 60)} 分钟`],
      ["预算", `每日 ${c.budget.daily_calls} 次 / ${fmtTokens(c.budget.daily_tokens)} token`],
      ["网关", c.gateway.provider],
    ];
    $("config-body").innerHTML = rows
      .map(([label, value]) => `<div><b>${label}</b>：${value}</div>`)
      .join("");
    $("config-hint").textContent = "只读 · 改配置需编辑 config.yaml";
  } catch (err) {
    $("config-hint").textContent = `读取失败：${err.message}`;
  }
}


async function doControl(act, target) {
  const label = { start: "启动", stop: "停止", restart: "重启" }[act] || act;
  const name = target === "all" ? "全部进程" : (PROC_TITLE[target] || target);
  try {
    const res = await api(`/api/control/${act}`, {
      method: "POST",
      body: JSON.stringify({ target }),
    });
    if (res.errors && res.errors.length) toast(`${name}：${res.errors.join("；")}`, true);
    else toast(`${name} 已${label}`);
  } catch (err) {
    toast(`${name} ${label}失败：${err.message}`, true);
  }
  refresh();
}

async function loadModels() {
  const select = $("model-select");
  select.innerHTML = '<option value="">加载中…</option>';
  try {
    const data = await api("/api/brain/models");
    const models = data.models || [];
    if (!models.length) {
      select.innerHTML = '<option value="">LM Studio 没有可用模型</option>';
      return;
    }
    select.innerHTML = models.map((m) => `<option value="${m}">${m}</option>`).join("");
    if (selectedModel && models.includes(selectedModel)) select.value = selectedModel;
  } catch (err) {
    select.innerHTML = '<option value="">加载失败</option>';
    toast(`拉取模型列表失败：${err.message}`, true);
  }
}

async function applyBrain() {
  if (!selectedProvider) return;
  const model = selectedProvider === "local_model" ? $("model-select").value : "";
  try {
    const data = await api("/api/brain", {
      method: "POST",
      body: JSON.stringify({ provider: selectedProvider, model }),
    });
    selectedModel = data.model || model;
    toast("已切换大脑模式");
    refresh();
  } catch (err) {
    toast(`切换失败：${err.message}`, true);
  }
}

function setLogSource(source) {
  currentSource = source;
  document.querySelectorAll("#log-tabs .tab").forEach((el) => {
    el.classList.toggle("active", el.dataset.source === source);
  });
  if (eventSource) eventSource.close();
  const pre = $("logs");
  pre.textContent = "";
  eventSource = new EventSource(`/api/logs/stream?source=${encodeURIComponent(source)}&tail=200`);
  eventSource.onmessage = (ev) => {
    pre.textContent += ev.data + "\n";
    if (pre.scrollTop + pre.clientHeight > pre.scrollHeight - 60) {
      pre.scrollTop = pre.scrollHeight;
    }
  };
  eventSource.onerror = () => {
    pre.textContent += "[控制台] 日志流断开，正在重连…\n";
  };
}

function initTabs() {
  $("log-tabs").innerHTML = LOG_SOURCES.map(
    (s) => `<span class="tab" data-source="${s}">${s}</span>`
  ).join("");
  document.querySelectorAll("#log-tabs .tab").forEach((el) => {
    el.addEventListener("click", () => setLogSource(el.dataset.source));
  });
  setLogSource("bot");
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (btn) { doControl(btn.dataset.act, btn.dataset.target); return; }
  const mode = ev.target.closest(".mode");
  if (mode && !mode.classList.contains("disabled")) {
    selectedProvider = mode.dataset.mode;
    renderBrain();
    if (selectedProvider === "local_model") loadModels();
  }
});

$("btn-refresh-models").addEventListener("click", loadModels);
$("btn-apply-brain").addEventListener("click", applyBrain);
$("btn-refresh-memory").addEventListener("click", loadMemory);
$("btn-summarize").addEventListener("click", triggerSummary);
$("btn-extract").addEventListener("click", triggerExtract);
$("btn-more-memory").addEventListener("click", () => {
  if (memoryLimit >= memoryPageMax) return;
  memoryLimit = Math.min(memoryPageMax, memoryLimit + MEMORY_PAGE);
  loadMemory();
});
$("memory-chat-filter").addEventListener("change", () => {
  memoryLimit = MEMORY_PAGE;
  loadMemory();
});
$("model-select").addEventListener("change", (ev) => { selectedModel = ev.target.value; });
$("btn-refresh-usage").addEventListener("click", loadUsage);
$("usage-days").addEventListener("change", (ev) => {
  usageDays = Number(ev.target.value) || 7;
  loadUsage();
});
$("btn-search").addEventListener("click", () => searchMessages(false));
$("search-q").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") searchMessages(false);
});
$("btn-search-more").addEventListener("click", () => searchMessages(true));
$("btn-refresh-sessions").addEventListener("click", loadSessions);
$("btn-refresh-config").addEventListener("click", loadConfig);
$("btn-restart-bot").addEventListener("click", () => {
  if (confirm("重启 Bot 进程？正在处理的对话会中断。")) doControl("restart", "bot");
});
$("btn-shutdown").addEventListener("click", async () => {
  if (!confirm("将停止 OpenCode / Bot / NapCat 三个进程并退出控制台，确定吗？")) return;
  try {
    await api("/api/shutdown", { method: "POST", body: "{}" });
    toast("正在关闭…可以关掉这个页面了");
  } catch (err) {
    toast(`退出失败：${err.message}`, true);
  }
});

initTabs();
refresh();
loadMemory();
loadUsage();
loadSessions();
loadConfig();
setInterval(refresh, 2000);
setInterval(loadMemory, 10000);
setInterval(loadUsage, 30000);
setInterval(loadSessions, 15000);
</script>
