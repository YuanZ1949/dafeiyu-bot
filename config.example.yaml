# 大肥鱼 / Deepseek娘 —— 配置模板
#
# 用法：运行 `dafeiyu init` 生成 config.yaml（本文件不会被读取）。
# 完整的键说明见 README；这里只标出「拿到项目后必须改」的几处。
#
# 凭据（QQ 号、API Key、NapCat 口令）一律放 .env，不要写进这个文件。
# 端口若被占用，改下面 supervisor / opencode 段的 port 即可。

persona:
  name: Deepseek娘
  aliases: [Deepseek娘, 大肥鱼, 小鲸鱼, 小菜鱼, 鱼鱼, 肥鱼]
  max_reply_chars: 120
  max_reply_chars_technical: 300
  # 长度安全阀：上面两个只是提示词里的软目标；真正发送前只守总字数/单条字数。
  reply_hard_total: 2000
  reply_hard_part: 500
  os_probability: 0.05
  # 重复守卫：同一句话最近 50 条里说过，就改写/换中性短句/这一片不说。
  repeat_guard: true
  # 机会检测（规则版）：纯热聊/纯表情批次先攒着不投，等点名或问句再一起送。
  opportunity_guard: true
  # 引用回复：被点名/被引用时把回复挂在原消息下；关掉后发纯文本。
  quote_reply: true
  # 留空使用内置人设 brain/persona.md；也可填自己的 md 路径（绝对或相对仓库根目录）
  prompt_file: ""

# token：直连 DeepSeek API（需 DEEPSEEK_API_KEY，有 key 时最省事）
# opencode：走专用 OpenCode 服务（supervisor 启动；opencode.exe 由安装脚本下载，无需 Node.js / npm）
# local_model：任意 OpenAI 兼容端点（默认本机 LM Studio）
# 运行时可在面板切换，选择存 data/runtime.json
brain:
  provider: opencode
  # free=opencode 免费模型，无需任何 key
  mode: free
  # 自备 Key 档（model 留空 = 切档时按端点清单自动选 flash；
  # 填了但已不在清单里，比如官方换掉 deepseek-chat，也会自动换）：
  # key:
  #   base_url: https://api.deepseek.com
  #   model: ""

gateway:
  # 频道选择：qq（仅 NapCat）/ wechat（仅桌面微信小号）/ both（qq+wechat 双通道，
  # 面板里每条通道可单独停用）。
  provider: qq
  # 桌面微信小号通道（UIA 桥）。小号专用、封号自担；默认关闭（wechat.enabled=false），
  # 启用前先跑 `dafeiyu doctor` 的 8 项预检；群范围只看面板白名单
  # （data/settings.local.yaml 的 groups.whitelist，空 = 不限制）。
  wechat:
    # 默认关闭；启用前先跑 `dafeiyu doctor` 的 8 项预检。
    enabled: false
    # wechat 的群范围不在本文件配置：以面板白名单 groups.whitelist 为准
    # （空 = 不限制；读不到面板 = fail-closed，不轮询也不发送）。

    # UIA 桥监听地址；gateway.wechat.bridge_host 绑非回环地址时 bridge_token 必填。
    bridge_host: 127.0.0.1
    bridge_port: 8790
    # 桥鉴权 token（gateway.wechat.bridge_token）：从 env 读 DAFEIYU_WECHAT_BRIDGE_TOKEN
    # （env 优先于配置文件）。桥绑回环时留空也可以；不要把真 token 写进模板。
    bridge_token: ""
    # 小号在群里的微信显示昵称（不是会话别名，别名由桥本地铸造）；启用时必填。
    account_nickname: ""
    # 机器人自己的微信 wxid（helper 的 wechat_account / --account）。
    # 同时登录多个微信账号时必须填，否则 hook 启动会报「多个微信账号同时登录」；
    # 留空 = 只在登录了一个账号时自动识别。也可在面板「微信账号」卡保存
    # （写入 data/settings.local.yaml），start-all.ps1 启动 hook 时会读这里。
    account: ""
    # bot 在群里的其他昵称（群昵称/别名）：@ 与引用回复判定用。
    # persona.aliases 启动时会自动并入，一般不用重复写。
    self_nicknames: []
    # RPA 侧轮询间隔（秒）。
    poll_seconds: 8.0
    # 未读门控：每个 tick 先读一次侧边栏红点（约 20ms），只有存在未读时才打开
    # 白名单群；false = 退回每轮全量打开（旧行为）。
    unread_gate: true
    # 免打扰会话不计红点，所以每隔这么多秒强制全量扫一遍白名单兜底。
    full_sweep_seconds: 120.0
    # 本地消息库入站（实验性）：直接只读解密微信自己的 SQLite（contact.db +
    # message_N.db）拿消息，不再逐群开窗抓屏；发送仍然走 UIA。
    # 需要微信正在运行（密钥从进程内存只读提取）；任何一步失败都会自动回落到
    # UIA 轮询，不会让入站停摆。微信升级后密钥格式可能失效，此时同样回落。
    local_db_enabled: false
    # 空 = 自动探测 %USERPROFILE%\Documents\xwechat_files\*\db_storage。
    local_db_root: ""
    # 解密镜像的最小同步间隔（秒）；0 = 每轮同步。
    local_db_refresh_seconds: 1.0
    # 微信私聊（好友会话）入站：默认关闭。开启后本地库会把 wxid_* 好友的
    # 私聊纳入轮询；只管「看得见」，要不要自动回由 private_reply 决定。
    # 系统号（文件传输助手、服务通知、公众号…）和 @openim 永远不算好友。
    private_enabled: false
    # 微信私聊自动回复：默认关闭。private_enabled=true 且此项为 true 才回；
    # 关闭时消息照常入库、面板可见，命令（/status 等）仍然可用。
    private_reply: false
    # 好友级白/黑名单：元素是稳定的 `wxg:<alias>` 会话 id（面板「微信私聊」卡可改，
    # 写入覆盖层后一个轮询周期内热生效）。deny 优先；allow 为空 = 不限制；
    # 两个名单都空时 32 个好友全放行。群聊完全不受这两个名单影响。
    private_allow: []
    private_deny: []
    # 出站后端：uia（默认，桌面自动化，锁屏不可用）/ hook（HTTP 注入，不依赖桌面，
    # 但需 hook_url + local_db_enabled，群 username 从本地库解析）/ auto（先 hook，
    # 只有明确「没发出去」时才回落 UIA；超时这类结果不明的情况不回落，避免重复发送）。
    outbound: uia
    # hook 服务地址（POST JSON，请求/响应契约见 wechat_bridge/outbound.py）。
    hook_url: ""
    # 可选：@ / 媒体专用端点。留空时按 hook_url 推导（.../send_text → .../send_at、
    # .../send_media）；推导不出来就明确回 unsupported_at / unsupported_media。
    hook_at_url: ""
    hook_media_url: ""
    # 原生桥单次发送可能 1–3s；5s 太紧，建议 30。
    hook_timeout_seconds: 5.0
    # 发送后回读本地库确认自己刚发的消息（需要 local_db_enabled）；未确认只把回执
    # 降级为 typed + receipt_unverified，绝不让客户端换 id 重发。
    send_verify: true
    send_verify_timeout_seconds: 8.0
    send_verify_interval_seconds: 0.5
    # 防封限速：相邻两次发送的最小间隔 / 每小时上限 / 每天上限；
    # 三者均可设为 0 = 不限制。默认 0（与 QQ 一致），但整条通道去节流后
    # 微信账号有风控/封号风险，请自行评估后再放开。
    send_min_interval_seconds: 0.0
    send_max_per_hour: 0
    send_max_per_day: 0
    # 静默时段 [start, end]，HH:MM，起止相同 = 不静默。
    # 不写这一项 = 00:00-00:00（不静默）；triggers.quiet_hours 只控制
    # 要不要回复，不影响这里能不能发。
    quiet_hours: ["00:00", "00:00"]
    # 模拟打字的延迟区间（秒）。
    typing_delay_seconds: [0.6, 1.2]
    # true：回执必须在本地库观察到这条消息；观察不到时标记
    # error_code=receipt_unverified（仍 ok=true，不重发，避免重复消息）。
    # false：只写日志，回执保持普通 typed。
    ack_requires_observed: true
    # 观察回声消息的时间窗口（秒）。
    echo_window_seconds: 120.0
    # 微信桥保活：true 时每 60 秒探一次 hook /health；失败只告警，
    # 由 supervisor 的重启兜底。默认关闭。
    keepalive: false
    # 发送前要求微信窗口前台且空闲（防误操作到别的窗口）。
    require_foreground_idle: true
    # 急停文件：该文件出现即停发。
    kill_switch_file: data/wechat.stop
    # 桌面客户端版本下限，低于则拒绝启动。
    version_min: "4.1.6"
    language: zh-CN
    allow_test_inject: false
    # 入站媒体（实验性）：默认关闭，关闭时只保留 [图片] 等占位，不读任何文件。
    # 开启后才会去本地库找到的图片路径读取并解密（.dat），落盘到
    # workspace.dir/images/，把相对路径写进消息正文交给大脑用 read 查看；
    # 语音不转写、视频不转码，文件只追加一条注记。
    media:
      enabled: false
      # 单张图片解密后的大小上限（字节）；超过就保留占位。
      max_bytes: 10485760
      # 空 = 自动探测 xwechat_files 目录；填了则只接受该根目录内的文件。
      storage_root: ""

# 跨群镜像（QQ ↔ 微信群）：把一对或多对群的发言双向转发，默认关闭。
# pairs 至少一对、可配多对，同一个群（归一化后）不能出现在两对里；qq 填 QQ 群号、
# wechat 填 `wxg:别名`（桥本地铸造的会话 id），两边都要带前缀。
# enabled: false 时下面的 pairs 会被忽略，可先填好备用。
# 启用（enabled: true）时启动即校验，不满足直接报错拒绝启动：
# gateway.provider 必须是 both、gateway.wechat.enabled=true、
# 微信四项已去节流（send_min_interval_seconds / send_max_per_hour /
# send_max_per_day 全 0，quiet_hours 起止相同——即上面微信段的当前值）。
# 媒体是尽力转发：QQ→微信需要 gateway.wechat.outbound: hook；
# 微信→QQ 需要 gateway.wechat.local_db_enabled + gateway.wechat.media.enabled；
# 能力不足时降级为 [图片] 之类的占位文本，不报错。
# 改这里的配置（或改微信四项）后，必须同时重启 bot 与微信桥才生效。
mirror:
  enabled: false
  pairs:
    - qq: "qq:123456789"
      wechat: "wxg:0d5c1f2a3b4c"
  # 可选：按平台给特定用户配镜像显示昵称（键必须带 qq: / wxg: 前缀）。
  # 也可以在面板「群互通（镜像）」卡片里改，面板的改动落在 data/settings.local.yaml。
  # nicknames:
  #   "qq:123456789": 老鱼
  # 消息泡：只套在「别人转来」的消息上——线上是三行圆角框，入库仍是单行
  # 「昵称：正文」（模型解析与检索不受多行内容影响）。
  # 默认 true；设 false 关掉，退化为今天的单行形态。
  bubble_enabled: true
  # 框的四角字符，顺序：左上/右上/左下/右下；默认 ╭╮╰╯，必须给足 4 个字符。
  bubble_corner_chars: "╭╮╰╯"
  # 正文按中文显示宽度换行的最大列数；默认 30（窄窗口也不易折行错位），最小 1。
  bubble_max_content_width: 30

# 服务端链接解析（chat-driven-behaviour-fixes）：群里出现链接时，由 bot 进程
# 先做两级抓取（HTTP 直抓 → 本机 Edge 有头最小化渲染），两级都失败才把
# 「请用 websearch 搜主题 / 一句话回退」的降级指令交给模型。
# 缺这一段也能启动——所有字段都有默认值；link.enabled: false 整条链关闭。
link:
  # 总闸：默认 true。设 false 整条服务端链关闭——不抓、不渲染、不注入
  # 【链接内容】块，模型仍按人设里的链接协议自己 websearch / 一句话回退。
  enabled: true
  # 单次 HTTP 抓取超时（秒）；默认 12，普通网页够用又不会拖住回复太久。
  timeout_seconds: 12
  # 单次抓取响应体大小上限（字节，默认 2MB）；超过按失败处理，不无限下载。
  max_bytes: 2000000
  # 正文进入提示词前的字符上限；默认 6000，防止长文挤占注入预算。
  max_chars: 6000
  # 缓存目录：URL 哈希命中的 JSON 缓存与 host-failures.json（失败结论）都落这里。
  cache_dir: data/link-cache
  # 缓存条目 TTL（秒）；默认 86400（1 天），过期视为未命中重新抓。
  cache_ttl_seconds: 86400
  # 缓存条目数上限；默认 500，超限按最旧淘汰，防止长期运行无限增长。
  cache_max_entries: 500
  # 缓存目录总大小上限（字节，默认 64MiB）；超限同样按最旧淘汰。
  cache_max_bytes: 67108864
  # 留空 = 用内置的浏览器级 User-Agent（实测 B 站默认 UA 412、浏览器 UA 200）；
  # 填了则覆盖。想伪装成别的客户端时才需要改。
  user_agent: ""
  # 一批消息里所有 URL 解析的总预算（秒，浮点）；默认 20，超预算的 URL 直接标
  # 「服务器读不到」，不得拖住回复主链路。
  total_budget_seconds: 20
  # 按 host 记录的失败结论保留时长（秒）；默认 604800（7 天），过期后允许重试。
  # 设 0 不合法（必须 >=1）；想尽快忘掉失败结论就调小。
  host_failure_ttl_seconds: 604800
  browser:
    # 本机浏览器渲染层：有头最小化 CDP（不下载浏览器、不装 Playwright、
    # 不读用户自己的 profile、不要求登录）。link.browser.enabled: false 关掉
    # 这一层（届时降级为搜索兜底；无桌面会话的 Windows 服务部署必须关）。
    enabled: true
    # 留空 = 自动探测本机已装的 Edge/Chrome；填可执行文件路径则用它。
    binary: ""
    # 只支持 minimized：实测无头（哪怕先有头预热再换无头）一律被知乎风控
    # 挡掉，所以其它任何值都会在启动时报错，绝不静默降级为无头。
    mode: minimized
    # 单个标签页的渲染超时（秒，浮点）；默认 30，知乎慢加载也够。
    timeout_seconds: 30
    # 单实例空闲这么多秒后关闭浏览器进程；默认 300，省内存又不频繁重启。
    idle_close_seconds: 300
    # 并发渲染最多同时开的标签页数；默认 2，再高会加重桌面负担。
    max_targets: 2
    # 独立的浏览器 profile 目录（--user-data-dir），绝不复用你自己的浏览器数据。
    profile_dir: data/link-browser-profile

opencode:
  # 留空自动找 npm 全局安装的 opencode.exe
  bin: ""
  agent: deepseek-qq
  # 钉死工作目录：session 的 location 与 CLI 的 cwd 都用它，从任何目录启动都不会
  # 让大脑跑到项目外。建议填绝对路径（相对路径按启动目录解析）。留空 = 用当前目录。
  project_dir: ""
  # 联网 + 工具调用（webfetch / 读写工作区）会拉长单轮时间。
  timeout_seconds: 240
  # 由 supervisor 拉起 serve，bot 只当客户端
  manage_server: false
  server_url: http://127.0.0.1:24310
  # serve 的 Basic 认证口令（用户名固定 opencode）。通常留空：supervisor 每次启动
  # 生成一个随机 32 位十六进制口令，并同时注入 opencode 与 bot 两个子进程（P7），
  # 不再依赖启动器手动 set 环境变量。也可以在 .env 里设 OPENCODE_SERVER_PASSWORD
  # （这里的显式值优先）。只有外部/手动跑 serve 时才需要填，保证 bot 与 serve 一致。
  server_password: ""
  db_path: data/opencode-bot.db
  host: 127.0.0.1
  port: 24310
  startup_timeout_seconds: 30
  # bot 专用 opencode 运行时目录：隔离全局插件 / MCP / 外来 agent，并把
  # log / snapshot / cache 一起放进这里（XDG_DATA_HOME / STATE / CACHE）。
  # 留空 = 沿用启动环境的配置（软回滚）；相对路径按启动目录解析。
  # 凭据（auth.json）首次启动时从全局 data 目录复制一份到隔离目录，之后各写各的。
  config_home: data/opencode-runtime/config

# NapCat 快登失败时的密码回退（可选）。凭据不要写在这里。
# 把值放 .env 或进程环境，键名 NAPCAT_QUICK_PASSWORD /
# NAPCAT_QUICK_PASSWORD_MD5（32 位十六进制，优先于明文）。
# 留空则只用 `-q <uin>` 快登，失败后回落二维码。
napcat:
  quick_password: ""
  quick_password_md5: ""
  # 每 N 秒给机器人自己发一条私聊（保活探针），0 = 关闭。
  keepalive_seconds: 1800

local_model:
  base_url: http://127.0.0.1:1234/v1
  # 留空：在面板里从 /v1/models 侦测并选择
  model: ""
  api_key: local
  # 思考型模型（Qwen3.x 等）先写 reasoning，预算太小会只出兜底话术
  max_tokens: 2048
  timeout_seconds: 60
  reasoning_effort: none
  # 切到本地模型时若 1234 没起，自动用 lms CLI 拉起 LM Studio。
  autostart: true
  # 留空自动找 ~/.lmstudio/bin/lms.exe 或 PATH 里的 lms。
  lms_path: ""
  autostart_timeout_seconds: 20

supervisor:
  dashboard:
    # 默认对局域网开放：手机/平板同网段可直接打开。
    # 绑定非回环地址时会强制登录，口令留空则由 supervisor 生成并写入
    # data/dashboard.password（也可用 DAFEIYU_DASHBOARD_PASSWORD 指定）。
    host: 0.0.0.0
    port: 8787
    open_browser: true
    # auto：绑定 loopback 时免登录，绑定 0.0.0.0/局域网地址时强制登录。
    # on：始终登录；off：只允许绑定 loopback。非 loopback + off 会拒绝启动。
    auth: auto
  control:
    host: 127.0.0.1
    port: 8788
  restart:
    backoff_seconds: [1, 2, 4, 8, 16, 30]
    max_failures: 5

triggers:
  # rules：旧的同步投递；model：入库后交给批次调度器决定何时回复。
  mode: model
  cooldown_seconds: 60
  sample_rate: 0.05
  # 起止相同 = 不启用机械静默；夜里也交给模型自己判断要不要开口。
  quiet_hours: ["00:00", "00:00"]
  keywords: [怎么, 为什么, 为啥, 求, 有没有, 是不是, 崩了, 报错, 怎么办]
  # 非点名消息攒多久再回。
  batch_seconds: 12
  # 点名后等群里说完再回；每来一条点名消息重新计时。
  addressed_debounce_seconds: 8
  # 防抖一直被打断时，最多等这么久也必须回。
  addressed_max_wait_seconds: 30
  # 两次非点名发言之间的最小间隔。
  ambient_min_interval_seconds: 15
  # 机器人说完后这么久没人接，算话题结束。
  thread_idle_seconds: 300
  # 话题结束后这段时间不主动接话；被点名会立刻重开。
  thread_closed_seconds: 600
  # 收尾期内非点名消息的放行概率，命中了交给模型自己判断要不要接；0 = 完全静默。
  closed_sample_rate: 0.05

groups:
  # 接受 `123456`（QQ 群号）或 `wxg:别名`（微信会话 id，由桥本地铸造）。
  # 留空 = 所有群都参与（不限制回复对象）；填了就只在名单内的群里主动回复。
  # 面板「群白名单」卡片也可编辑本项，保存到 data/settings.local.yaml，即时生效，留空 = 不限制。
  # 号之间用逗号分隔。
  whitelist: []
  blacklist: []
  # 群指令（/闭嘴、/醒来）只允许这些 QQ 号执行；留空 = 谁都不能用。
  admins: []

budget:
  # 每群每日硬上限：必须 > 0；用完后点名也不回。
  daily_calls: 200
  daily_tokens: 300000
  # 非点名消息能动的额度比例；点名的回复永远优先。
  ambient_ratio: 0.8
  # 所有会话合计的每日上限（0 = 未启用）。
  global_daily_calls: 0
  global_daily_tokens: 0
  # 所有会话合计的自然月上限（0 = 未启用；按上海时区划分月份）。
  monthly_calls: 0
  monthly_tokens: 0
  # 月度费用上限（0 = 不限制）。> 0 时必须填下面的单价，按百万 token 估算。
  monthly_cost_limit: 0
  currency: CNY
  price_input_per_million: 0
  price_output_per_million: 0
  # 额度用到这些比例时预警；每项取值 (0, 1]，升序去重。
  warning_ratios: [0.5, 0.8, 1.0]
  # 超限动作：degrade = 只停非点名回复；stop = 全部停用；notify = 只告警不拦截。
  on_exceed: degrade

# 长期记忆工作区：模型自己的笔记，只有 data/bot-workspace/ 可读写。
# dir 留空 = 关闭工作区与注入（软回滚）。
workspace:
  dir: data/bot-workspace
  memory_chars: 500
  summary_chars: 250
  impression_chars: 150
  max_file_bytes: 65536

# QQ 图片消息物化：落盘 workspace.dir/images/ 并把路径写进 content，
# 大脑用 read 工具看图（模型需支持视觉）。
images:
  enabled: true
  max_bytes: 10485760
  timeout_seconds: 8
  # 落盘图片保留天数，0 = 永久保留。
  retention_days: 7
  # 入站图片最长边上限：超过则用 ffmpeg 等比缩小（缺 ffmpeg 保留原图）。
  # 0 = 不降采样。
  max_edge: 1280

# 入站语音转写（QQ 语音 / 微信语音）。默认关闭：关掉时语音完全不处理，
# 正文只保留 [语音] 占位，也不下载、不落盘。
# 需要可选依赖：pip install -e ".[stt]"（faster-whisper + silk-python）。
# 另外需要 ffmpeg（可用 DAFEIYU_FFMPEG 指定路径）；ffmpeg 没有 SILK 解码器，
# SILK 由 pysilk 先解码成 PCM 再交给 ffmpeg。
speech:
  enabled: false
  # faster-whisper 模型名或本地目录：tiny/base/small/medium/large-v3。
  model: base
  language: zh
  device: cpu
  compute_type: int8
  beam_size: 1
  # 超过这个时长（秒）的语音不转写，只记原文件路径。
  max_seconds: 60
  # 单条语音的下载/解码/转写总超时（秒）。
  timeout_seconds: 90
  # 同时转写的语音数；CPU 上建议保持 1。
  concurrency: 1
  # 单条语音文件大小上限（字节）；QQ 语音通常远小于此。
  max_bytes: 20971520
  # 引导模型输出简体中文；实测 base 默认会吐繁体。留空 = 不传。
  initial_prompt: "以下是普通话的句子，请用简体中文转写。"
  # HuggingFace 镜像：本机直连 huggingface.co 会超时，国内建议填镜像。
  # 留空 = 不设置 HF_ENDPOINT（直连）。
  hf_endpoint: "https://hf-mirror.com"
  # 出站语音合成（edge-tts，可选：pip install -e ".[tts]"）。默认关闭。
  # 注意：启用后，回复文本会被发送到云端 TTS 提供商（edge-tts / 微软语音）。
  # 未安装可选依赖或合成失败时自动退回纯文本。
  tts_enabled: false
  # 云端音色；中文女声默认 zh-CN-XiaoxiaoNeural。
  tts_voice: "zh-CN-XiaoxiaoNeural"
  # 语速，按 edge-tts 的百分比写法（如 "+0%" / "-10%"）。
  tts_rate: "+0%"
  # 超过该字数的文本不合成（直接发纯文本）。
  tts_max_chars: 200

memory:
  window_size: 20
  impression_topk: 3
  extract_every: 20
  # 消息保留天数；0 = 永久保留。
  retention_days: 180  # 默认 180 天；0 = 永久保留
  rotation_messages: 60
  rotation_days: 7
  rotation_tokens: 40000
  inject_summaries: true
  inject_impressions: true
  # 「此刻」注入：现在几点、本群叫什么、距上次开口多久、刚才是谁在说。
  # 关掉后 prompt 里不再有【此刻】那行，其余记忆注入不受影响。
  scene_injection: true
  recall_enabled: true
  recall_topk: 3
  recall_chars: 300
  # 记忆层（P1）：episodes / open_loops 由 Observer 写入。
  # 「正在聊的事」= 当前这段对话的一句话摘要，只注最新一条 open；
  # 「没有下文的事」= 谁问了没人接、谁答应了没做，取最近 1–3 条。
  # 示例配置与本机配置默认 true（打开注入）；代码默认 false，缺键的旧配置行为
  # 不变，可软回滚到「不注入」。
  inject_episodes: true
  inject_open_loops: true
  open_loop_topk: 3
  open_loop_chars: 200
  episode_chars: 220
  # 「正在聊的事 + 没有下文的事 + 你和他 + 本鱼的近况 + 我的立场 + 群友印象」的合计
  # 字符预算（默认 1000，装得下六段上限 990）；超了按「印象 → 立场 → 近况 → 关系卡 →
  # 未了事」丢弃，正在聊的事永不主动丢，只在最后截断。
  mind_chars: 1000
  state_chars: 100
  relation_chars: 160
  # 「我的立场」：跨群共享的观点条数/字符预算；只在 mind 总闸打开时注入。
  stance_topk: 3
  stance_chars: 160
  # 群气氛：把最近 10 分钟的消息量/人数/问句比例拼进「此刻」；默认关。
  atmosphere_enabled: false
  # 「本群的教训」（机器人自己写的复盘笔记）段的字符预算，默认 300——
  # 够装 3-5 条教训，又不至于挤掉其它注入段。设更大值会挤压「正在聊的事」。
  lessons_chars: 300

# 心智层（P1）：默认全关，灰度打开；关掉即回到当前行为（软回滚）。
# 缺这一段也能启动——所有字段都有默认值。
mind:
  enabled: false
  state_enabled: true
  episodes_enabled: true
  # Observer/Reflector 统一走当前主脑；主脑需要具备 complete_detailed。
  observer_enabled: false
  observer_interval_seconds: 600
  observer_min_messages: 8
  # 单群每天「观察 + 夜间自省」的总调用上限，与回复预算分开计。
  # 粗略成本 ≈ 该值 × 白名单群数（白名单为空时面板不估算）。
  observer_daily_calls: 24
  # 每天几点之后跑自省（0-23，上海时区）。
  reflection_hour: 5
  # QQ 表情回应：默认关闭；开启后机器人发出消息会尝试贴一个表情（失败只记日志）。
  # emoji id 与 NapCat/QQ 版本相关，上线前先用真实环境验证。
  emoji_reactions: false
  emoji_reaction_id: "128"
  # 跨群立场（P3）：Reflector 每晚把「明确表过态的观点」写库，注入受
  # mind.enabled 总闸控制；关掉只停止注入，已写入的立场保留。
  stances_enabled: true
  # 入站语音/图片先贴个表情回应（P3）：默认关闭，避免对每条媒体消息都贴。
  inbound_media_reactions: false
  # 同一会话两次入站反应的最小间隔（秒）。
  inbound_media_reaction_cooldown_seconds: 600
  # 承诺跟进（P3）：对「说过要做某事」且之后没再出现的会话主动追问一句；
  # 代码默认关闭，开启后仍受静音/预算/每日上限与「创建后无新 bot 发言」门控。
  proactive_followup: false
  # 只跟进创建超过这么多小时的 promise。
  followup_after_hours: 24
  # 同一会话每日最多主动跟进几次（按上海日期计）。
  followup_daily_cap: 3
  # 注定没人接的批次（纯表情/超短句/纯链接等）在调模型前被确定性过滤，
  # 省一整轮模型调用；被 @、引用机器人或回答机器人提问的批次永远豁免。
  # 默认 true；设 false 关掉（回到逐批都调模型）。
  skip_known_silent: true
  # 上面这条过滤只在「机器人在这么多秒内刚说过话」时生效：刚开口后出现的
  # 弱批次大概率不是在等你，直接跳过；超出冷却窗的批次照常走模型。
  # 默认 90；调小更省调用、也更容易误跳，调大更保守。
  skip_silent_cooldown_seconds: 90

# 面板「聊天行为」卡片可实时改；这里的值只是默认值，面板改动写
# data/settings.local.yaml，重启后仍然保留。
behavior:
  # quiet：只回点名（@/引用/叫名字）；normal：当前行为；
  # active：放开「话题收尾」和「连续空转降频」两个软闸门。
  chat_intensity: normal
  # off：不限制；soft：只把限制注入提示；strict：命中关键词的整条回复丢弃；
  # regenerate：命中后先让模型改写（每批最多 2 次），仍命中则删掉含禁句的整句。
  # 注意：YAML 里裸 off 会被解析成布尔值，想手改请像下面这样加引号。
  restriction_mode: "off"
  # 关键词级子串匹配（不是语义审核）；面板一行一个。
  banned_phrases: []
  banned_topics: []

# 社交动作（戳一戳/进群欢迎）：短句与模板都是固定的，不调用模型。
# 代码默认关闭；模板里打开戳一戳，让新部署也能给出反应。
social:
  # 被戳时回一句固定短句；仍受静音/聊天强度/预算/冷却/每日上限共同门控。
  poke_enabled: true
  # 同一会话两次回应之间的最小间隔（秒）。
  poke_cooldown_seconds: 300
  # 同一会话每日最多回应次数（按上海日期计）。
  poke_daily_cap: 20
  # 进群欢迎：默认关闭，模板为空串时即使开关打开也不发。
  join_welcome_enabled: false
  join_welcome: ""
  join_welcome_daily_cap: 10

logging:
  level: INFO
  dir: logs

# 运维健康巡检 / 告警 / 备份 / 审计。
# 模板默认关闭：不开就不建 AlertManager，也不发任何外呼。
# 开启后不配 webhook / qq_admin 时，事件只写 data/alert-state.json 与面板 /api/alerts。
alerts:
  enabled: false
  check_seconds: 30
  # 同一告警重复通知间隔（秒），>=300；disk_low 另有 12h 下限。
  repeat_seconds: 21600
  webhook:
    # 留空 = 不启用 webhook 通道。想收手机推送就填一个 ntfy topic。
    url: ""
    format: generic  # generic | ntfy | wecom | dingtalk
  # QQ 管理员号：非 0 时通过 bot 的 /api/notify/admin 发私聊告警。
  qq_admin: 0
  rules:
    bot_down_seconds: 120
    napcat_down_seconds: 180
    wechat_down_seconds: 180
    opencode_down_seconds: 120
    quota_pause: true
    disk_free_percent: 10
    reply_error_window_seconds: 900
    reply_error_count: 3
    budget_warning: true
    # 距上次成功备份超过这么多小时（或从未成功过）就告警「备份过期」；
    # backup.enabled=false 的部署豁免。
    backup_stale_hours: 25
    # memory.pending_count（还没生成摘要的天数）达到该值就告警「记忆落后」；
    # 额度熔断期间不报。
    memory_gap_days: 2

backup:
  enabled: true
  dir: data/backups
  # 主备份成功后把 .db、同名 manifest 与 workspace zip 再复制一份到该目录；
  # 空 = 关闭，与 dir 相同则跳过；镜像失败只记独立错误字段，不影响主备份。
  mirror_dir: ""
  # scheduled 备份按天保留 N 份，另按周（周日 04:00 那批）保留 N 份。
  daily_keep: 7
  weekly_keep: 4
  schedule_hour: 4
  max_total_gb: 20
  max_upload_mb: 512

# append-only JSONL 审计；超过 max_bytes 轮转，保留 backups 份历史。
audit:
  path: data/audit.jsonl
  max_bytes: 10485760
  backups: 3
