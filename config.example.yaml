# 大肥鱼 / Deepseek娘 —— 配置模板
#
# 用法：运行 `dafeiyu init` 生成 config.yaml（本文件不会被读取）。
# 完整的键说明见 README；这里只标出「拿到项目后必须改」的几处。
#
# 凭据（QQ 号、API Key、NapCat 口令）一律放 .env，不要写进这个文件。
# 端口若被占用，改下面 supervisor / opencode 段的 port 即可。

persona:
  name: Deepseek娘
  aliases: [Deepseek娘, 大肥鱼, 小鲸鱼, 鱼鱼, 肥鱼]
  max_reply_chars: 120
  max_reply_chars_technical: 300
  os_probability: 0.05
  # 留空使用内置人设 brain/persona.md；也可填自己的 md 路径（绝对或相对仓库根目录）
  prompt_file: ""

# token：直连 DeepSeek API（需 DEEPSEEK_API_KEY，有 key 时最省事）
# opencode：走专用 OpenCode 服务（supervisor 启动；opencode.exe 由安装脚本下载，无需 Node.js / npm）
# local_model：任意 OpenAI 兼容端点（默认本机 LM Studio）
# 运行时可在面板切换，选择存 data/runtime.json
brain:
  provider: opencode
  # free=opencode 免费模型，无需任何 key
  mode: free
  # 自备 Key 档（model 留空 = 切档时按端点清单自动选 flash；
  # 填了但已不在清单里，比如官方换掉 deepseek-chat，也会自动换）：
  # key:
  #   base_url: https://api.deepseek.com
  #   model: ""

gateway:
  # 频道选择：qq（仅 NapCat）/ wechat（仅桌面微信小号）/ both（qq+wechat 双通道，
  # 面板里每条通道可单独停用）。
  provider: qq
  # 桌面微信小号通道（UIA 桥）。小号专用、封号自担；默认关闭（wechat.enabled=false），
  # 启用前先跑 `dafeiyu doctor` 的 8 项预检；group_allowlist 为空时拒绝启动
  # （语义是「拒绝」，不是「放开所有群」）。
  wechat:
    # 默认关闭；启用前先跑 `dafeiyu doctor` 的 8 项预检。
    enabled: false
    # UIA 桥监听地址；gateway.wechat.bridge_host 绑非回环地址时 bridge_token 必填。
    bridge_host: 127.0.0.1
    bridge_port: 8790
    # 桥鉴权 token（gateway.wechat.bridge_token）：从 env 读 DAFEIYU_WECHAT_BRIDGE_TOKEN
    # （env 优先于配置文件）。桥绑回环时留空也可以；不要把真 token 写进模板。
    bridge_token: ""
    # 小号在群里的微信显示昵称（不是会话别名，别名由桥本地铸造）；启用时必填。
    account_nickname: ""
    # 目标群的**微信显示名**（桥用 `open_chat` 按显示名打开会话）；别名由桥
    # 本地铸造、首次轮询前不存在，不能写在这里。
    # 留空 = gateway.wechat.group_allowlist 为空 = 拒绝启动。
    group_allowlist: []
    # 最多参与的微信群数上限。
    max_groups: 3
    # RPA 侧轮询间隔（秒）。
    poll_seconds: 8.0
    # 防封限速：相邻两次发送的最小间隔 / 每小时上限 / 每天上限；
    # 三者均可设为 0 = 不限制；quiet_hours 起止相同 = 关闭静默时段。
    send_min_interval_seconds: 20.0
    send_max_per_hour: 20
    send_max_per_day: 60
    # 静默时段 [start, end]，HH:MM，起止相同 = 不静默。
    quiet_hours: ["23:30", "08:00"]
    # 模拟打字的延迟区间（秒）。
    typing_delay_seconds: [0.6, 1.2]
    # 发送后必须观察到已发出的消息才算成功；超时按失败处理。
    ack_requires_observed: true
    # 观察回声消息的时间窗口（秒）。
    echo_window_seconds: 120.0
    keepalive: false
    # 发送前要求微信窗口前台且空闲（防误操作到别的窗口）。
    require_foreground_idle: true
    # 急停文件：该文件出现即停发。
    kill_switch_file: data/wechat.stop
    # 桌面客户端版本下限，低于则拒绝启动。
    version_min: "4.1.6"
    language: zh-CN
    allow_test_inject: false

opencode:
  # 留空自动找 npm 全局安装的 opencode.exe
  bin: ""
  agent: deepseek-qq
  project_dir: ""
  # 联网 + 工具调用（webfetch / 读写工作区）会拉长单轮时间。
  timeout_seconds: 240
  # 由 supervisor 拉起 serve，bot 只当客户端
  manage_server: false
  server_url: http://127.0.0.1:24310
  # serve 的 Basic 认证口令（用户名固定 opencode）。通常留空：supervisor 每次启动
  # 生成一个随机 32 位十六进制口令，并同时注入 opencode 与 bot 两个子进程（P7），
  # 不再依赖启动器手动 set 环境变量。也可以在 .env 里设 OPENCODE_SERVER_PASSWORD
  # （这里的显式值优先）。只有外部/手动跑 serve 时才需要填，保证 bot 与 serve 一致。
  server_password: ""
  db_path: data/opencode-bot.db
  host: 127.0.0.1
  port: 24310
  startup_timeout_seconds: 30
  # bot 专用 opencode 配置目录：隔离全局插件 / MCP / 外来 agent。
  # 留空 = 沿用启动环境的配置（软回滚）；相对路径按启动目录解析。
  config_home: data/opencode-runtime/config

# NapCat 快登失败时的密码回退（可选）。凭据不要写在这里。
# 把值放 .env 或进程环境，键名 NAPCAT_QUICK_PASSWORD /
# NAPCAT_QUICK_PASSWORD_MD5（32 位十六进制，优先于明文）。
# 留空则只用 `-q <uin>` 快登，失败后回落二维码。
napcat:
  quick_password: ""
  quick_password_md5: ""
  # 每 N 秒给机器人自己发一条私聊（保活探针），0 = 关闭。
  keepalive_seconds: 1800

local_model:
  base_url: http://127.0.0.1:1234/v1
  # 留空：在面板里从 /v1/models 侦测并选择
  model: ""
  api_key: local
  # 思考型模型（Qwen3.x 等）先写 reasoning，预算太小会只出兜底话术
  max_tokens: 2048
  timeout_seconds: 60
  reasoning_effort: none
  # 切到本地模型时若 1234 没起，自动用 lms CLI 拉起 LM Studio。
  autostart: true
  # 留空自动找 ~/.lmstudio/bin/lms.exe 或 PATH 里的 lms。
  lms_path: ""
  autostart_timeout_seconds: 20

supervisor:
  dashboard:
    # 默认对局域网开放：手机/平板同网段可直接打开。
    # 绑定非回环地址时会强制登录，口令留空则由 supervisor 生成并写入
    # data/dashboard.password（也可用 DAFEIYU_DASHBOARD_PASSWORD 指定）。
    host: 0.0.0.0
    port: 8787
    open_browser: true
    # auto：绑定 loopback 时免登录，绑定 0.0.0.0/局域网地址时强制登录。
    # on：始终登录；off：只允许绑定 loopback。非 loopback + off 会拒绝启动。
    auth: auto
  control:
    host: 127.0.0.1
    port: 8788
  restart:
    backoff_seconds: [1, 2, 4, 8, 16, 30]
    max_failures: 5

triggers:
  # rules：旧的同步投递；model：入库后交给批次调度器决定何时回复。
  mode: model
  cooldown_seconds: 60
  sample_rate: 0.05
  # 起止相同 = 不启用机械静默；夜里也交给模型自己判断要不要开口。
  quiet_hours: ["00:00", "00:00"]
  keywords: [怎么, 为什么, 为啥, 求, 有没有, 是不是, 崩了, 报错, 怎么办]
  # 非点名消息攒多久再回。
  batch_seconds: 12
  # 点名后等群里说完再回；每来一条点名消息重新计时。
  addressed_debounce_seconds: 8
  # 防抖一直被打断时，最多等这么久也必须回。
  addressed_max_wait_seconds: 30
  # 两次非点名发言之间的最小间隔。
  ambient_min_interval_seconds: 15
  # 机器人说完后这么久没人接，算话题结束。
  thread_idle_seconds: 300
  # 话题结束后这段时间不主动接话；被点名会立刻重开。
  thread_closed_seconds: 600
  # 收尾期内非点名消息的放行概率，命中了交给模型自己判断要不要接；0 = 完全静默。
  closed_sample_rate: 0.05

groups:
  # 接受 `123456`（QQ 群号）或 `wxg:别名`（微信会话 id，由桥本地铸造）。
  # 留空 = 所有群都参与（不限制回复对象）；填了就只在名单内的群里主动回复。
  # 面板「群白名单」卡片也可编辑本项，保存到 data/settings.local.yaml，即时生效，留空 = 不限制。
  # 号之间用逗号分隔。
  whitelist: []
  blacklist: []
  # 群指令（/闭嘴、/醒来）只允许这些 QQ 号执行；留空 = 谁都不能用。
  admins: []

budget:
  # 每群每日硬上限：必须 > 0；用完后点名也不回。
  daily_calls: 200
  daily_tokens: 300000
  # 非点名消息能动的额度比例；点名的回复永远优先。
  ambient_ratio: 0.8
  # 所有会话合计的每日上限（0 = 未启用）。
  global_daily_calls: 0
  global_daily_tokens: 0
  # 所有会话合计的自然月上限（0 = 未启用；按上海时区划分月份）。
  monthly_calls: 0
  monthly_tokens: 0
  # 月度费用上限（0 = 不限制）。> 0 时必须填下面的单价，按百万 token 估算。
  monthly_cost_limit: 0
  currency: CNY
  price_input_per_million: 0
  price_output_per_million: 0
  # 额度用到这些比例时预警；每项取值 (0, 1]，升序去重。
  warning_ratios: [0.5, 0.8, 1.0]
  # 超限动作：degrade = 只停非点名回复；stop = 全部停用；notify = 只告警不拦截。
  on_exceed: degrade

# 长期记忆工作区：模型自己的笔记，只有 data/bot-workspace/ 可读写。
# dir 留空 = 关闭工作区与注入（软回滚）。
workspace:
  dir: data/bot-workspace
  memory_chars: 500
  summary_chars: 250
  impression_chars: 150
  max_file_bytes: 65536

# QQ 图片消息物化：落盘 workspace.dir/images/ 并把路径写进 content，
# 大脑用 read 工具看图（模型需支持视觉）。
images:
  enabled: true
  max_bytes: 10485760
  timeout_seconds: 8
  # 落盘图片保留天数，0 = 永久保留。
  retention_days: 7

memory:
  window_size: 20
  impression_topk: 3
  extract_every: 20
  # 消息保留天数；0 = 永久保留。
  retention_days: 180  # 默认 180 天；0 = 永久保留
  rotation_messages: 60
  rotation_days: 7
  rotation_tokens: 40000
  inject_summaries: true
  inject_impressions: true
  recall_enabled: true
  recall_topk: 3
  recall_chars: 300

# 面板「聊天行为」卡片可实时改；这里的值只是默认值，面板改动写
# data/settings.local.yaml，重启后仍然保留。
behavior:
  # quiet：只回点名（@/引用/叫名字）；normal：当前行为；
  # active：放开「话题收尾」和「连续空转降频」两个软闸门。
  chat_intensity: normal
  # off：不限制；soft：只把限制注入提示；strict：命中关键词的整条回复丢弃。
  # 注意：YAML 里裸 off 会被解析成布尔值，想手改请像下面这样加引号。
  restriction_mode: "off"
  # 关键词级子串匹配（不是语义审核）；面板一行一个。
  banned_phrases: []
  banned_topics: []

logging:
  level: INFO
  dir: logs

# 运维健康巡检 / 告警 / 备份 / 审计。
# 模板默认关闭：不开就不建 AlertManager，也不发任何外呼。
# 开启后不配 webhook / qq_admin 时，事件只写 data/alert-state.json 与面板 /api/alerts。
alerts:
  enabled: false
  check_seconds: 30
  # 同一告警重复通知间隔（秒），>=300；disk_low 另有 12h 下限。
  repeat_seconds: 21600
  webhook:
    # 留空 = 不启用 webhook 通道。想收手机推送就填一个 ntfy topic。
    url: ""
    format: generic  # generic | ntfy | wecom | dingtalk
  # QQ 管理员号：非 0 时通过 bot 的 /api/notify/admin 发私聊告警。
  qq_admin: 0
  rules:
    bot_down_seconds: 120
    napcat_down_seconds: 180
    wechat_down_seconds: 180
    opencode_down_seconds: 120
    quota_pause: true
    disk_free_percent: 10
    reply_error_window_seconds: 900
    reply_error_count: 3
    budget_warning: true

backup:
  enabled: true
  dir: data/backups
  # scheduled 备份按天保留 N 份，另按周（周日 04:00 那批）保留 N 份。
  daily_keep: 7
  weekly_keep: 4
  schedule_hour: 4
  max_total_gb: 20
  max_upload_mb: 512

# append-only JSONL 审计；超过 max_bytes 轮转，保留 backups 份历史。
audit:
  path: data/audit.jsonl
  max_bytes: 10485760
  backups: 3
