persona:
  name: Deepseek娘
  aliases: [Deepseek娘, 大肥鱼, 小鲸鱼, 鱼鱼, 肥鱼]
  max_reply_chars: 120
  max_reply_chars_technical: 300
  os_probability: 0.05
  # 留空使用内置人设 brain/persona.md；也可填自己的 md 路径（绝对或相对仓库根目录）
  prompt_file: ""

# opencode：走专用 OpenCode 服务（supervisor 启动，独立 DB）
# token：直连 DeepSeek API（原 local，向后兼容）
# local_model：任意 OpenAI 兼容端点（默认本机 LM Studio）
# 运行时可在 dashboard 切换，选择存 data/runtime.json
brain:
  provider: opencode

opencode:
  # 留空自动找 npm 全局安装的 opencode.exe
  bin: ""
  agent: deepseek-qq
  # 留空使用当前工作目录（start.ps1 会切到 dafeiyu-bot）
  project_dir: ""
  # 联网 + 工具调用（webfetch / 读写工作区）会拉长单轮时间。
  timeout_seconds: 240
  # Phase 2 起由 supervisor 拉起 serve，bot 只当客户端
  manage_server: false
  server_url: http://127.0.0.1:24310
  db_path: data/opencode-bot.db
  host: 127.0.0.1
  port: 24310
  startup_timeout_seconds: 30
  # bot 专用 opencode 配置目录：隔离全局插件 / MCP / 外来 agent。
  # 留空 = 沿用启动环境的配置（软回滚）；相对路径按启动目录解析。
  # 凭据（auth.json）在 data 目录，不受影响，不需要复制。
  config_home: data/opencode-runtime/config

# NapCat 快登失败时的密码回退（可选）。凭据不要写在这里：config.yaml 进版本库。
# 把值放 .env（已 gitignore）或进程环境，键名 NAPCAT_QUICK_PASSWORD /
# NAPCAT_QUICK_PASSWORD_MD5（32 位十六进制，优先于明文）。
# 留空则只用 `-q <uin>` 快登，失败后回落二维码。
napcat:
  quick_password: ""
  quick_password_md5: ""

local_model:
  # 本机 LM Studio 默认端口
  base_url: http://127.0.0.1:1234/v1
  # 留空：在 dashboard 里从 /v1/models 侦测并选择
  model: ""
  api_key: local
  # 思考型模型（Qwen3.x 等）先写 reasoning，预算太小会只出兜底话术
  max_tokens: 2048
  # 本地推理比云端慢
  timeout_seconds: 60
  # qwen3.5 这类强思考模型会把 600 token 预算全烧在 reasoning 上，
  # 旁路（印象/摘要）content 恒空。none = 关掉思考；留空 = 不发该字段。
  reasoning_effort: none

supervisor:
  dashboard:
    host: 127.0.0.1
    port: 8787
    open_browser: true
  control:
    host: 127.0.0.1
    port: 8788
  restart:
    backoff_seconds: [1, 2, 4, 8, 16, 30]
    max_failures: 5

triggers:
  # rules：旧的同步投递；model：入库后交给批次调度器决定何时回复。
  mode: model
  cooldown_seconds: 60
  sample_rate: 0.05
  quiet_hours: ["01:00", "07:00"]
  keywords: [怎么, 为什么, 为啥, 求, 有没有, 是不是, 崩了, 报错, 怎么办]
  # 非点名消息攒多久再回。
  batch_seconds: 45
  # 点名后等群里说完再回；每来一条点名消息重新计时。
  addressed_debounce_seconds: 8
  # 防抖一直被打断时，最多等这么久也必须回。
  addressed_max_wait_seconds: 30
  # 两次非点名发言之间的最小间隔。
  ambient_min_interval_seconds: 90

groups:
  whitelist: []
  blacklist: []
  # 群指令（/闭嘴、/醒来）只允许这些 QQ 号执行
  admins: []

budget:
  daily_calls: 200
  daily_tokens: 300000
  # 非点名消息能动的额度比例；点名的回复永远优先。
  ambient_ratio: 0.8

# 长期记忆工作区：模型自己的笔记，只有 data/bot-workspace/ 可读写。
# dir 留空 = 关闭工作区与注入（软回滚），同时给 session 下全量 deny。
workspace:
  dir: data/bot-workspace
  # 三段注入的字符预算（不是 token）。
  memory_chars: 500
  summary_chars: 250
  impression_chars: 150
  # 单文件事后检查上限，超了保留尾部并插截断注释。
  max_file_bytes: 65536

memory:
  window_size: 20
  impression_topk: 3
  extract_every: 20
  # 会话轮换阈值，任一满足即换 session。
  rotation_messages: 60
  rotation_days: 7
  rotation_tokens: 40000
  inject_summaries: true
  inject_impressions: true

logging:
  level: INFO
  dir: logs
