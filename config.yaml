persona:
  name: Deepseek娘
  aliases: [Deepseek娘, 大肥鱼, 小鲸鱼, 鱼鱼, 肥鱼]
  max_reply_chars: 120
  max_reply_chars_technical: 300
  os_probability: 0.05
  # 留空使用内置人设 brain/persona.md；也可填自己的 md 路径（绝对或相对仓库根目录）
  prompt_file: ""

# opencode：走专用 OpenCode 服务（supervisor 启动，独立 DB）
# token：直连 DeepSeek API（原 local，向后兼容）
# local_model：任意 OpenAI 兼容端点（默认本机 LM Studio）
# 运行时可在 dashboard 切换，选择存 data/runtime.json
brain:
  provider: opencode

gateway:
  # 只支持 qq；wechat 会在启动期直接报 ConfigError（协议未实现，不假装能跑）。
  provider: qq

opencode:
  # 留空自动找 npm 全局安装的 opencode.exe
  bin: ""
  agent: deepseek-qq
  # 留空使用当前工作目录（start.ps1 会切到 dafeiyu-bot）
  project_dir: ""
  # 联网 + 工具调用（webfetch / 读写工作区）会拉长单轮时间。
  timeout_seconds: 240
  # Phase 2 起由 supervisor 拉起 serve，bot 只当客户端
  manage_server: false
  server_url: http://127.0.0.1:24310
  db_path: data/opencode-bot.db
  host: 127.0.0.1
  port: 24310
  startup_timeout_seconds: 30
  # bot 专用 opencode 配置目录：隔离全局插件 / MCP / 外来 agent。
  # 留空 = 沿用启动环境的配置（软回滚）；相对路径按启动目录解析。
  # 凭据（auth.json）在 data 目录，不受影响，不需要复制。
  config_home: data/opencode-runtime/config

# NapCat 快登失败时的密码回退（可选）。凭据不要写在这里：config.yaml 进版本库。
# 把值放 .env（已 gitignore）或进程环境，键名 NAPCAT_QUICK_PASSWORD /
# NAPCAT_QUICK_PASSWORD_MD5（32 位十六进制，优先于明文）。
# 留空则只用 `-q <uin>` 快登，失败后回落二维码。
napcat:
  quick_password: ""
  quick_password_md5: ""

local_model:
  # 本机 LM Studio 默认端口
  base_url: http://127.0.0.1:1234/v1
  # 留空：在 dashboard 里从 /v1/models 侦测并选择
  model: ""
  api_key: local
  # 思考型模型（Qwen3.x 等）先写 reasoning，预算太小会只出兜底话术
  max_tokens: 2048
  # 本地推理比云端慢
  timeout_seconds: 60
  # qwen3.5 这类强思考模型会把 600 token 预算全烧在 reasoning 上，
  # 旁路（印象/摘要）content 恒空。none = 关掉思考；留空 = 不发该字段。
  reasoning_effort: none

supervisor:
  dashboard:
    host: 127.0.0.1
    port: 8787
    open_browser: true
    # auto：绑定 loopback 时免登录，绑定 0.0.0.0/局域网地址时强制登录。
    # on：始终登录；off：只允许绑定 loopback。非 loopback + off 会拒绝启动。
    auth: auto
  control:
    host: 127.0.0.1
    port: 8788
  restart:
    backoff_seconds: [1, 2, 4, 8, 16, 30]
    max_failures: 5

triggers:
  # rules：旧的同步投递；model：入库后交给批次调度器决定何时回复。
  mode: model
  cooldown_seconds: 60
  sample_rate: 0.05
  quiet_hours: ["01:00", "07:00"]
  keywords: [怎么, 为什么, 为啥, 求, 有没有, 是不是, 崩了, 报错, 怎么办]
  # 非点名消息攒多久再回。
  batch_seconds: 45
  # 点名后等群里说完再回；每来一条点名消息重新计时。
  addressed_debounce_seconds: 8
  # 防抖一直被打断时，最多等这么久也必须回。
  addressed_max_wait_seconds: 30
  # 两次非点名发言之间的最小间隔。
  ambient_min_interval_seconds: 90

groups:
  whitelist: []
  blacklist: []
  # 群指令（/闭嘴、/醒来）只允许这些 QQ 号执行
  admins: []

budget:
  # 每群每日硬上限：必须 > 0；用完后点名也不回。
  daily_calls: 200
  daily_tokens: 300000
  # 非点名消息能动的额度比例；点名的回复永远优先。
  ambient_ratio: 0.8
  # 所有会话合计的每日上限（0 = 未启用）。
  global_daily_calls: 0
  global_daily_tokens: 0
  # 所有会话合计的自然月上限（0 = 未启用；按上海时区划分月份）。
  monthly_calls: 0
  monthly_tokens: 0
  # 月度费用上限（0 = 不限制）。> 0 时必须填下面的单价，按百万 token 估算。
  monthly_cost_limit: 0
  currency: CNY
  price_input_per_million: 0
  price_output_per_million: 0
  # 额度用到这些比例时预警；每项取值 0–1，升序去重。
  warning_ratios: [0.5, 0.8, 1.0]
  # 超限动作：degrade = 只停非点名回复；stop = 全部停用；notify = 只告警不拦截。
  on_exceed: degrade

# 长期记忆工作区：模型自己的笔记，只有 data/bot-workspace/ 可读写。
# dir 留空 = 关闭工作区与注入（软回滚），同时给 session 下全量 deny。
workspace:
  dir: data/bot-workspace
  # 三段注入的字符预算（不是 token）。
  memory_chars: 500
  summary_chars: 250
  impression_chars: 150
  # 单文件事后检查上限，超了保留尾部并插截断注释。
  max_file_bytes: 65536

memory:
  window_size: 20
  impression_topk: 3
  extract_every: 20
  # 消息保留天数；0 = 永久保留。>0 时每天清理更早的消息（摘要与印象不受影响）。
  retention_days: 0
  # 会话轮换阈值，任一满足即换 session。
  rotation_messages: 60
  rotation_days: 7
  rotation_tokens: 40000
  inject_summaries: true
  inject_impressions: true
  # 回复前按当前批次检索同会话旧消息，作为「相关旧记忆」注入；代码默认关，这里显式开启。
  recall_enabled: true
  recall_topk: 3
  recall_chars: 300

logging:
  level: INFO
  dir: logs

# 运维（分册 A）：健康巡检、告警、备份、审计。
# alerts 默认关闭：不开就不建 AlertManager，也不发任何外呼。
alerts:
  enabled: false
  # 巡检间隔（秒），5-3600。
  check_seconds: 30
  # 同一告警重复通知间隔（秒），>=300；disk_low 另有 12h 下限。
  repeat_seconds: 21600
  webhook:
    # 留空 = 不启用 webhook 通道。
    url: ""
    format: generic  # generic | ntfy | wecom | dingtalk
  # QQ 管理员号：非 0 时通过 bot 的 /api/notify/admin 发私聊告警。
  qq_admin: 0
  rules:
    bot_down_seconds: 120
    napcat_down_seconds: 180
    opencode_down_seconds: 120
    quota_pause: true
    disk_free_percent: 10
    reply_error_window_seconds: 900
    reply_error_count: 3

# 备份默认开启，只写本地目录；手动/恢复前备份不受保留策略清理。
backup:
  enabled: true
  dir: data/backups
  # scheduled 备份按天保留 N 份，另按周（周日 04:00 那批）保留 N 份。
  daily_keep: 7
  weekly_keep: 4
  # 每天这个整点后第一次巡检触发 scheduled 备份。
  schedule_hour: 4
  # 备份目录总大小上限；超限从最旧的 scheduled 开始删，至少保留 3 份。
  max_total_gb: 20
  # 恢复上传上限（MB），超限返回 413。
  max_upload_mb: 512

# append-only JSONL 审计；超过 max_bytes 轮转，保留 backups 份历史。
audit:
  path: data/audit.jsonl
  max_bytes: 10485760
  backups: 3
